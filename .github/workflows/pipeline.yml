name: Pipeline Atividade Final DevSecOps

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  code-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependências
        run: npm install

      - name: Rodar testes unitários
        run: npm test -- --watchAll=false

      - name: ESLint (análise de código)
        run: npx eslint . --ext .js,.jsx,.ts,.tsx || true

  build:
    runs-on: ubuntu-latest
    needs: code-analysis

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Instalar dependências
        run: npm install

      - name: Build da aplicação
        run: npm run build

      - name: Upload do build
        uses: actions/upload-artifact@v3
        with:
          name: build
          path: build

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Download do build
        uses: actions/download-artifact@v3
        with:
          name: build
          path: build

      - name: Deploy para o GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build